          package com.maya.ai

          import android.content.Context
          import android.content.SharedPreferences
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey

          /** API key ও সেটিংস এনক্রিপ্টেড অবস্থায় ফোনে সংরক্ষণ করে। */
          object Prefs {
              @Volatile private var cached: SharedPreferences? = null

              private fun sp(c: Context): SharedPreferences {
                  cached?.let { return it }
                  synchronized(this) {
                      cached?.let { return it }
                      val app = c.applicationContext
                      val key = MasterKey.Builder(app).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build()
                      val p = EncryptedSharedPreferences.create(
                          app, "maya_secure", key,
                          EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                          EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                      )
                      cached = p
                      return p
                  }
              }

              fun apiKey(c: Context): String = sp(c).getString("api_key", "") ?: ""
              fun setApiKey(c: Context, v: String) = sp(c).edit().putString("api_key", v.trim()).apply()

              fun model(c: Context): String = sp(c).getString("model", "gemini-2.5-flash") ?: "gemini-2.5-flash"
              fun setModel(c: Context, v: String) = sp(c).edit().putString("model", v.trim()).apply()

              /** "bn-BD" অথবা "en-US" */
              fun lang(c: Context): String = sp(c).getString("lang", "bn-BD") ?: "bn-BD"
              fun setLang(c: Context, v: String) = sp(c).edit().putString("lang", v).apply()
          }
