          package com.maya.ai

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          /** সেটআপ স্ক্রিন: পারমিশন কন্ট্রোল সেন্টার + API key + বল চালু/বন্ধ। */
          class MainActivity : Activity() {

              private lateinit var root: LinearLayout
              private lateinit var permBox: LinearLayout

              private val bg = Color.parseColor("#0B1220")
              private val card = Color.parseColor("#111B2E")
              private val cyan = Color.parseColor("#00E5FF")

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(24), dp(16), dp(24))
                  }
                  setContentView(ScrollView(this).apply {
                      setBackgroundColor(bg)
                      addView(root)
                  })
                  buildUi()
              }

              override fun onResume() {
                  super.onResume()
                  renderPermissions()
              }

              // ---------- UI ----------

              private fun text(s: String, size: Float, color: Int, bold: Boolean = false) = TextView(this).apply {
                  text = s; textSize = size; setTextColor(color)
                  if (bold) setTypeface(typeface, android.graphics.Typeface.BOLD)
              }

              private fun button(label: String, onClick: () -> Unit) = Button(this).apply {
                  text = label
                  setOnClickListener { onClick() }
              }

              private fun buildUi() {
                  root.addView(text("Maya AI", 28f, cyan, true))
                  root.addView(text("আপনার ভয়েসে ফোন চালানো AI", 14f, Color.LTGRAY))

                  root.addView(text("\nপারমিশন কন্ট্রোল সেন্টার", 18f, Color.parseColor("#FFC107"), true))
                  permBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(permBox)

                  root.addView(text("\nGemini সেটিংস", 18f, Color.parseColor("#FFC107"), true))
                  root.addView(text("aistudio.google.com থেকে ফ্রি API key নিন", 12f, Color.LTGRAY))

                  val key = EditText(this).apply {
                      hint = "Gemini API key"
                      setHintTextColor(Color.GRAY); setTextColor(Color.WHITE)
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setText(Prefs.apiKey(this@MainActivity))
                  }
                  val model = EditText(this).apply {
                      hint = "Model (যেমন gemini-2.5-flash)"
                      setHintTextColor(Color.GRAY); setTextColor(Color.WHITE)
                      setText(Prefs.model(this@MainActivity))
                  }
                  root.addView(key)
                  root.addView(model)

                  val langBtn = button(langLabel()) {}
                  langBtn.setOnClickListener {
                      val next = if (Prefs.lang(this) == "bn-BD") "en-US" else "bn-BD"
                      Prefs.setLang(this, next)
                      langBtn.text = langLabel()
                  }
                  root.addView(langBtn)
                  root.addView(button("Save") {
                      Prefs.setApiKey(this, key.text.toString())
                      if (model.text.isNotBlank()) Prefs.setModel(this, model.text.toString())
                      Toast.makeText(this, "সেভ হয়েছে", Toast.LENGTH_SHORT).show()
                  })

                  root.addView(text("\nমায়া চালু করুন", 18f, Color.parseColor("#FFC107"), true))
                  root.addView(button("▶ ভাসমান বল চালু করুন") { startBall() })
                  root.addView(button("■ বন্ধ করুন") {
                      startService(Intent(this, FloatingBallService::class.java).setAction(FloatingBallService.ACTION_STOP))
                  })

                  root.addView(text("\nটেক্সট দিয়ে টেস্ট (মাইক ছাড়া)", 14f, Color.LTGRAY))
                  val cmd = EditText(this).apply {
                      hint = "যেমন: ইউটিউব খোলো"
                      setHintTextColor(Color.GRAY); setTextColor(Color.WHITE)
                  }
                  root.addView(cmd)
                  root.addView(button("চালান") {
                      if (!ready()) return@button
                      val i = Intent(this, FloatingBallService::class.java)
                          .setAction(FloatingBallService.ACTION_RUN)
                          .putExtra(FloatingBallService.EXTRA_TEXT, cmd.text.toString())
                      startForegroundService(i)
                  })
              }

              private fun langLabel() = "ভাষা: " + if (Prefs.lang(this) == "bn-BD") "বাংলা (bn-BD)" else "English (en-US)"

              private fun permRow(title: String, desc: String, ok: Boolean, action: () -> Unit) {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(card)
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                      val lpm = LinearLayout.LayoutParams(-1, -2)
                      lpm.topMargin = dp(8)
                      layoutParams = lpm
                  }
                  box.addView(text((if (ok) "✅ " else "⬜ ") + title, 16f, if (ok) Color.parseColor("#00E676") else Color.WHITE, true))
                  box.addView(text(desc, 12f, Color.LTGRAY))
                  if (!ok) box.addView(button("অনুমতি দিন") { action() }.apply { gravity = Gravity.CENTER })
                  permBox.addView(box)
              }

              // ---------- পারমিশন ----------

              private fun micOk() = checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
              private fun overlayOk() = Settings.canDrawOverlays(this)
              private fun a11yOk() = MayaAccessibilityService.instance != null
              private fun notifOk() = Build.VERSION.SDK_INT < 33 ||
                  checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED
              private fun batteryOk() =
                  (getSystemService(POWER_SERVICE) as PowerManager).isIgnoringBatteryOptimizations(packageName)

              private fun renderPermissions() {
                  permBox.removeAllViews()
                  permRow("মাইক্রোফোন", "মায়ার সাথে কথা বলার জন্য", micOk()) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                  }
                  permRow("ভাসমান বল (Overlay)", "অন্য অ্যাপের ওপরেও বল দেখানোর জন্য", overlayOk()) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  permRow(
                      "অ্যাক্সেসিবিলিটি সার্ভিস",
                      "স্ক্রিন পড়া, ট্যাপ, টাইপ, হোম/ব্যাকের জন্য। তালিকা থেকে Maya AI খুঁজে চালু করুন।",
                      a11yOk()
                  ) { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  permRow("নোটিফিকেশন", "মায়াকে ব্যাকগ্রাউন্ডে জাগ্রত রাখতে", notifOk()) {
                      if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 2)
                  }
                  permRow("ব্যাটারি অপ্টিমাইজেশন বন্ধ", "ব্যাকগ্রাউন্ডে সার্ভিস যেন বন্ধ না হয়", batteryOk()) {
                      startActivity(
                          Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName"))
                      )
                  }
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, results: IntArray) {
                  super.onRequestPermissionsResult(code, perms, results)
                  renderPermissions()
              }

              private fun ready(): Boolean {
                  val missing = when {
                      !micOk() -> "মাইক্রোফোন"
                      !overlayOk() -> "ভাসমান বল (Overlay)"
                      !a11yOk() -> "অ্যাক্সেসিবিলিটি"
                      Prefs.apiKey(this).isBlank() -> "Gemini API key"
                      else -> null
                  }
                  if (missing != null) {
                      Toast.makeText(this, "আগে দিন: $missing", Toast.LENGTH_LONG).show()
                      return false
                  }
                  return true
              }

              private fun startBall() {
                  if (!ready()) return
                  startForegroundService(Intent(this, FloatingBallService::class.java))
                  Toast.makeText(this, "বল চালু হয়েছে। বলে ট্যাপ করে কথা বলুন।", Toast.LENGTH_LONG).show()
              }
          }
