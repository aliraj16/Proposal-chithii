          package com.maya.ai

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          /**
           * ফোন কন্ট্রোলের মূল সার্ভিস: স্ক্রিন পড়া, ক্লিক, টাইপ, স্ক্রল, হোম/ব্যাক।
           * ইউজারকে সেটিংসে গিয়ে নিজ হাতে এটি চালু করতে হয়।
           */
          class MayaAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile var instance: MayaAccessibilityService? = null
                  private const val MAX_NODES = 120
              }

              private val nodes = ArrayList<AccessibilityNodeInfo>()

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              // ---------- স্ক্রিন পড়া ----------

              @Synchronized
              fun dumpScreen(): String {
                  nodes.clear()
                  val root = rootInActiveWindow ?: return "(screen unavailable)"
                  val sb = StringBuilder("package=${root.packageName}\n")
                  walk(root, sb)
                  return sb.toString()
              }

              private fun walk(n: AccessibilityNodeInfo?, sb: StringBuilder) {
                  if (n == null || !n.isVisibleToUser || nodes.size >= MAX_NODES) return
                  val label = (n.text ?: n.contentDescription ?: n.hintText)?.toString()?.trim().orEmpty()
                  if (label.isNotEmpty() || n.isClickable || n.isEditable) {
                      val kinds = ArrayList<String>()
                      if (n.isEditable) kinds.add("input")
                      if (n.isClickable) kinds.add("click")
                      if (n.isScrollable) kinds.add("scroll")
                      if (n.isChecked) kinds.add("checked")
                      if (kinds.isEmpty()) kinds.add("text")
                      sb.append("[").append(nodes.size).append("] ")
                          .append(kinds.joinToString("|")).append(" \"")
                          .append(label.replace("\n", " ").take(80)).append("\"\n")
                      nodes.add(n)
                  }
                  for (i in 0 until n.childCount) walk(n.getChild(i), sb)
              }

              @Synchronized
              fun labelOf(index: Int): String {
                  val n = nodes.getOrNull(index) ?: return ""
                  return (n.text ?: n.contentDescription ?: "").toString()
              }

              // ---------- অ্যাকশন ----------

              @Synchronized
              fun clickIndex(index: Int): Boolean {
                  val n = nodes.getOrNull(index) ?: return false
                  var cur: AccessibilityNodeInfo? = n
                  var depth = 0
                  while (cur != null && depth < 6) {
                      if (cur.isClickable && cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
                      cur = cur.parent
                      depth++
                  }
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  return tap(r.centerX().toFloat(), r.centerY().toFloat())
              }

              @Synchronized
              fun typeText(index: Int, text: String): Boolean {
                  val target = if (index >= 0) nodes.getOrNull(index) else findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                  target ?: return false
                  target.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  return target.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
              }

              fun scroll(direction: String): Boolean {
                  val m = resources.displayMetrics
                  val x = m.widthPixels / 2f
                  val top = m.heightPixels * 0.30f
                  val bottom = m.heightPixels * 0.70f
                  // "down" = নিচের কনটেন্ট দেখতে আঙুল ওপরে টানা
                  return if (direction == "up") swipe(x, top, x, bottom) else swipe(x, bottom, x, top)
              }

              fun back() = performGlobalAction(GLOBAL_ACTION_BACK)
              fun home() = performGlobalAction(GLOBAL_ACTION_HOME)
              fun recents() = performGlobalAction(GLOBAL_ACTION_RECENTS)
              fun notifications() = performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS)

              fun openApp(name: String): Boolean {
                  val pm = packageManager
                  val query = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(query, 0)
                  val q = name.trim().lowercase()
                  if (q.isEmpty()) return false
                  fun label(i: android.content.pm.ResolveInfo) = i.loadLabel(pm).toString().lowercase()
                  val match = apps.firstOrNull { label(it) == q }
                      ?: apps.firstOrNull { label(it).contains(q) }
                      ?: apps.firstOrNull { label(it).length > 2 && q.contains(label(it)) }
                      ?: return false
                  val launch = pm.getLaunchIntentForPackage(match.activityInfo.packageName) ?: return false
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  startActivity(launch)
                  return true
              }

              // ---------- জেসচার ----------

              private fun tap(x: Float, y: Float): Boolean {
                  val p = Path().apply { moveTo(x, y) }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0, 60)).build()
                  return dispatchGesture(g, null, null)
              }

              private fun swipe(x1: Float, y1: Float, x2: Float, y2: Float): Boolean {
                  val p = Path().apply { moveTo(x1, y1); lineTo(x2, y2) }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0, 350)).build()
                  return dispatchGesture(g, null, null)
              }
          }
          MAYA_EOF_9
          mkdir -p app/src/main/java/com/maya/ai
          cat > app/src/main/java/com/maya/ai/Agent.kt <<'MAYA_EOF_10'
          package com.maya.ai

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          /**
           * এজেন্ট লুপ: স্ক্রিন পড়ো → Gemini-কে জিজ্ঞেস করো → একটি অ্যাকশন চালাও → পুনরাবৃত্তি।
           * কাজ শেষ হলে বা সীমা ছুঁলে থামে।
           */
          class Agent(
              private val ctx: Context,
              private val speak: (String) -> Unit
          ) {
              @Volatile var cancelled = false

              companion object {
                  private const val MAX_STEPS = 15

                  /** পেমেন্ট/টাকা পাঠানো/মুছে ফেলার মতো ঝুঁকিপূর্ণ বাটনে ক্লিক সফটওয়্যার-স্তরে আটকানো হয়। */
                  private val DANGEROUS = Regex(
                      "(pay now|confirm payment|send money|transfer|cash out|cashout|delete account|factory reset|" +
                          "পেমেন্ট|টাকা পাঠান|সেন্ড মানি|ক্যাশ আউট|মুছে ফেল)",
                      RegexOption.IGNORE_CASE
                  )

                  private const val SYSTEM = """
          You are Maya, an assistant that operates an Android phone for its owner by reading the screen's accessibility tree and choosing exactly ONE action per step.

          Reply with ONLY one JSON object, no prose. Allowed actions:
          {"action":"open_app","app":"<app name as shown on launcher>"}
          {"action":"click","index":<number from screen list>}
          {"action":"type","index":<number of input field, or -1 for the focused field>,"text":"<text>"}
          {"action":"scroll","direction":"up"|"down"}
          {"action":"back"} {"action":"home"} {"action":"recents"} {"action":"notifications"}
          {"action":"wait","seconds":<1-5>}
          {"action":"done","speech":"<short spoken result for the user>"}
          {"action":"ask","speech":"<question or refusal spoken to the user>"}

          Rules:
          - Elements are listed as [index] kinds "label". Use only indexes from the CURRENT screen list.
          - Take small steps. After opening an app or clicking, the next screen will be shown to you.
          - Use "done" as soon as the user's request is fulfilled. Put the answer or a short confirmation in speech.
          - Use "ask" if you need information, are stuck, or the task involves payments, money transfer, PINs, OTPs, passwords, or deleting data. Never enter or reveal secrets. Tell the user to do that part themselves.
          - Only send messages or make calls when the user's command explicitly asks for it.
          - Write "speech" in the same language as the user's command (usually Bangla). Keep it under 25 words.
          """
              }

              fun run(command: String) {
                  val svc = MayaAccessibilityService.instance
                  if (svc == null) {
                      speak("অ্যাক্সেসিবিলিটি সার্ভিস চালু নেই। আগে এটি চালু করুন।")
                      return
                  }
                  val key = Prefs.apiKey(ctx)
                  if (key.isBlank()) {
                      speak("আগে অ্যাপে Gemini API key সেভ করুন।")
                      return
                  }
                  val model = Prefs.model(ctx)
                  val history = StringBuilder()

                  for (step in 1..MAX_STEPS) {
                      if (cancelled) return
                      val screen = svc.dumpScreen()
                      val prompt = "User command: $command\n\nHistory so far:\n" +
                          (if (history.isEmpty()) "(none)" else history.toString()) +
                          "\n\nCurrent screen:\n$screen"

                      val raw = try {
                          GeminiClient.generate(key, model, SYSTEM, prompt)
                      } catch (e: Exception) {
                          speak("ইন্টারনেট বা API সমস্যা হয়েছে।")
                          return
                      }
                      if (cancelled) return

                      val json = parse(raw)
                      if (json == null) {
                          history.append("step $step: invalid JSON from model\n")
                          continue
                      }
                      val action = json.optString("action")
                      var result = "ok"

                      when (action) {
                          "done", "ask" -> {
                              speak(json.optString("speech", "ঠিক আছে"))
                              return
                          }
                          "open_app" -> {
                              val app = json.optString("app")
                              result = if (svc.openApp(app)) "opened $app" else "app not found: $app"
                          }
                          "click" -> {
                              val i = json.optInt("index", -1)
                              val label = svc.labelOf(i)
                              if (DANGEROUS.containsMatchIn(label)) {
                                  speak("এটি আর্থিক বা ঝুঁকিপূর্ণ কাজ, তাই আমি করব না। আপনি নিজে নিশ্চিত করুন।")
                                  return
                              }
                              result = if (svc.clickIndex(i)) "clicked [$i] $label" else "click failed on [$i]"
                          }
                          "type" -> {
                              val i = json.optInt("index", -1)
                              val text = json.optString("text")
                              result = if (svc.typeText(i, text)) "typed" else "type failed"
                          }
                          "scroll" -> result = if (svc.scroll(json.optString("direction", "down"))) "scrolled" else "scroll failed"
                          "back" -> svc.back()
                          "home" -> svc.home()
                          "recents" -> svc.recents()
                          "notifications" -> svc.notifications()
                          "wait" -> {
                              val s = json.optInt("seconds", 1).coerceIn(1, 5)
                              sleep(s * 1000L)
                          }
                          else -> result = "unknown action"
                      }
                      history.append("step $step: $action ${json.toString().take(120)} -> $result\n")
                      sleep(1100) // স্ক্রিন স্থির হতে সময় দিন
                  }
                  speak("কাজটি শেষ করতে পারিনি। আরেকবার চেষ্টা করুন।")
              }

              private fun sleep(ms: Long) {
                  try { Thread.sleep(ms) } catch (_: InterruptedException) { cancelled = true }
              }

              private fun parse(raw: String): JSONObject? {
                  var t = raw.trim()
                  if (t.startsWith("```")) {
                      t = t.removePrefix("```json").removePrefix("```").removeSuffix("```").trim()
                  }
                  return try {
                      if (t.startsWith("[")) JSONArray(t).optJSONObject(0) else JSONObject(t)
                  } catch (e: Exception) {
                      null
                  }
              }
          }
