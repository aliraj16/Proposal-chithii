          package com.maya.ai

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.TextView
          import java.util.Locale
          import java.util.concurrent.Executors
          import kotlin.math.abs

          /**
           * স্ক্রিনের ওপর ভাসমান বল। বলে ট্যাপ করুন → কথা বলুন → মায়া কাজ করবে।
           * বল টেনে সরানো যায়। কাজ চলার সময় ট্যাপ করলে কাজ থামে।
           */
          class FloatingBallService : Service() {

              companion object {
                  const val ACTION_STOP = "com.maya.ai.STOP"
                  const val ACTION_RUN = "com.maya.ai.RUN"
                  const val EXTRA_TEXT = "text"
                  private const val CHANNEL = "maya_channel"
                  private const val NOTIF_ID = 1
                  @Volatile var running = false
              }

              private enum class State { IDLE, LISTENING, WORKING }

              private lateinit var wm: WindowManager
              private lateinit var lp: WindowManager.LayoutParams
              private var ball: TextView? = null
              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private val main = Handler(Looper.getMainLooper())
              private val exec = Executors.newSingleThreadExecutor()
              @Volatile private var agent: Agent? = null
              private var state = State.IDLE

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  running = true
                  startAsForeground()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  addBall()
                  initTts()
                  initRecognizer()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_STOP -> { stopSelf(); return START_NOT_STICKY }
                      ACTION_RUN -> {
                          val t = intent.getStringExtra(EXTRA_TEXT).orEmpty()
                          if (t.isNotBlank()) main.post { runCommand(t) }
                      }
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  running = false
                  agent?.cancelled = true
                  try { ball?.let { wm.removeView(it) } } catch (_: Exception) {}
                  recognizer?.destroy()
                  tts?.shutdown()
                  exec.shutdownNow()
                  super.onDestroy()
              }

              // ---------- ফোরগ্রাউন্ড নোটিফিকেশন ----------

              private fun startAsForeground() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL, "Maya", NotificationManager.IMPORTANCE_LOW)
                  )
                  val stop = PendingIntent.getService(
                      this, 0,
                      Intent(this, FloatingBallService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = Notification.Builder(this, CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("মায়া জেগে আছে")
                      .setContentText("ভাসমান বলে ট্যাপ করে কথা বলুন")
                      .addAction(Notification.Action.Builder(null, "বন্ধ করুন", stop).build())
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(NOTIF_ID, n)
                  }
              }

              // ---------- ভাসমান বল ----------

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun addBall() {
                  val size = dp(64)
                  val v = TextView(this).apply {
                      text = "🎙"
                      textSize = 26f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      elevation = dp(8).toFloat()
                  }
                  ball = v
                  paint(Color.parseColor("#1E88E5"))

                  lp = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(16)
                      y = dp(220)
                  }

                  var startX = 0; var startY = 0
                  var touchX = 0f; var touchY = 0f
                  var moved = false
                  v.setOnTouchListener { view, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = lp.x; startY = lp.y
                              touchX = e.rawX; touchY = e.rawY
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - touchX).toInt()
                              val dy = (e.rawY - touchY).toInt()
                              if (abs(dx) > 10 || abs(dy) > 10) moved = true
                              lp.x = startX + dx
                              lp.y = startY + dy
                              wm.updateViewLayout(view, lp)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) onBallTap()
                              true
                          }
                          else -> false
                      }
                  }
                  wm.addView(v, lp)
              }

              private fun paint(color: Int) {
                  ball?.background = GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(color)
                      setStroke(dp(3), Color.parseColor("#00E5FF"))
                  }
              }

              private fun setState(s: State) {
                  state = s
                  paint(
                      when (s) {
                          State.IDLE -> Color.parseColor("#1E88E5")      // নীল
                          State.LISTENING -> Color.parseColor("#43A047") // সবুজ
                          State.WORKING -> Color.parseColor("#FB8C00")   // কমলা
                      }
                  )
              }

              private fun onBallTap() {
                  when (state) {
                      State.IDLE -> startListening()
                      State.LISTENING -> recognizer?.stopListening()
                      State.WORKING -> {
                          agent?.cancelled = true
                          tts?.stop()
                          setState(State.IDLE)
                      }
                  }
              }

              // ---------- ভয়েস ইনপুট / আউটপুট ----------

              private fun initTts() {
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          val loc = Locale.forLanguageTag(Prefs.lang(this))
                          val r = tts?.setLanguage(loc)
                          if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                              tts?.setLanguage(Locale.US)
                          }
                          ttsReady = true
                      }
                  }
              }

              private fun speak(text: String) {
                  if (ttsReady) tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "maya")
              }

              private fun initRecognizer() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) return
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                      setRecognitionListener(object : RecognitionListener {
                          override fun onResults(results: Bundle?) {
                              val t = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                  ?.firstOrNull().orEmpty()
                              if (t.isBlank()) setState(State.IDLE) else runCommand(t)
                          }
                          override fun onError(error: Int) { setState(State.IDLE) }
                          override fun onReadyForSpeech(params: Bundle?) {}
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onPartialResults(partialResults: Bundle?) {}
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                      })
                  }
              }

              private fun startListening() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      speak("মাইক্রোফোন পারমিশন দিন।")
                      return
                  }
                  val r = recognizer
                  if (r == null) {
                      speak("এই ফোনে স্পিচ রিকগনিশন পাওয়া যায়নি।")
                      return
                  }
                  tts?.stop()
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, Prefs.lang(this@FloatingBallService))
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false)
                  }
                  setState(State.LISTENING)
                  r.startListening(i)
              }

              // ---------- কমান্ড চালানো ----------

              private fun runCommand(text: String) {
                  setState(State.WORKING)
                  val a = Agent(this) { speak(it) }
                  agent = a
                  exec.execute {
                      try {
                          a.run(text)
                      } catch (e: Exception) {
                          speak("একটি সমস্যা হয়েছে।")
                      } finally {
                          main.post { setState(State.IDLE) }
                      }
                  }
              }
          }
